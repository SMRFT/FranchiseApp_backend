<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Password Reset - Error</title>
    <style>
        body {
            font-family: "Segoe UI", sans-serif;
            background: #f3f4f6;
            margin: 0;
            padding: 0;
        }
        .wrapper {
            max-width: 480px;
            margin: 60px auto;
            background: #ffffff;
            border-radius: 10px;
            padding: 30px 25px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.08);
            text-align: center;
        }
        h2 {
            color: #dc2626;
            font-size: 22px;
            margin-bottom: 10px;
        }
        p {
            color: #4b5563;
            font-size: 14px;
            line-height: 1.5;
        }
        .back-btn {
            margin-top: 25px;
            background: #6366f1;
            color: white;
            padding: 10px 18px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 14px;
            display: inline-block;
        }
    </style>
</head>
<body>

<div class="wrapper">
    <h2>⚠️ Error</h2>
    <p>{{ error }}</p>

    <a href="/" class="back-btn">Go to Home</a>
</div>

</body>
</html>
