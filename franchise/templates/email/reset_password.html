<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password - Shanmuga Diagnostics</title>
    <style>
        body {
            font-family: "Segoe UI", sans-serif;
            background: #eef2ff;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 480px;
            margin: 60px auto;
            padding: 30px;
            background: #ffffff;
            box-shadow: 0 4px 18px rgba(0,0,0,0.06);
            border-radius: 10px;
        }
        h2 {
            text-align: center;
            color: #4338ca;
            font-size: 22px;
            margin-bottom: 8px;
        }
        p {
            text-align: center;
            font-size: 14px;
            color: #6b7280;
        }
        label {
            display: block;
            margin-top: 18px;
            font-size: 13px;
            color: #374151;
        }
        input[type="password"] {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
        }
        .submit-btn {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
        }
        .submit-btn:hover {
            background: #4338ca;
        }
        .footer-info {
            margin-top: 18px;
            text-align: center;
            font-size: 12px;
            color: #6b7280;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Reset Your Password</h2>
    <p>Enter a new password for your franchise account.</p>

    <form action="/api/confirm-reset-password/" method="POST">
        <input type="hidden" name="token" value="{{ token }}">
        <input type="hidden" name="franchise_id" value="{{ franchise_id }}">

        <label>New Password</label>
        <input type="password" name="new_password" required minlength="6">

        <label>Confirm Password</label>
        <input type="password" name="confirm_password" required minlength="6">

        <button type="submit" class="submit-btn">Update Password</button>
    </form>

    <div class="footer-info">
        <p>Email: <strong>{{ email }}</strong></p>
    </div>
</div>

</body>
</html>
